<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TypingClub TR</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <strong>TypingClub TR</strong>
    <span id="total-stars">⭐ 0</span>
    <span id="total-level">Lv 1</span>
    <button type="button" id="btn-badges">Rozetler</button>
  </header>

  <section id="view-home">
    <h1>Dersler</h1>
    <p>Türkçe Q · ç ğ ı ö ş ü · 5 yıldız hedefi</p>
    <div id="lesson-path"></div>
  </section>

  <section id="view-practice" hidden>
    <p>
      <button type="button" id="btn-exit">← Dersler</button>
      <button type="button" id="btn-restart">Yeniden</button>
      <span id="practice-title"></span>
    </p>
    <p id="stars-live">☆☆☆☆☆</p>
    <p>WPM <strong id="live-wpm">0</strong> · Doğruluk <strong id="live-acc">100%</strong></p>
    <div id="progress-track"><div id="progress-fill"></div></div>
    <div id="prompt" class="prompt"></div>
    <p id="finger-hint"></p>
    <input id="hidden-input" class="hidden-input" autocomplete="off" spellcheck="false" />
    <div id="hands" class="hands" hidden>
      <div class="hand left" id="hand-left"></div>
      <div class="hand right" id="hand-right"></div>
    </div>
    <div id="keyboard" class="keyboard"></div>
    <p>
      <label><input type="checkbox" id="toggle-sfx" checked /> Ses</label>
      <label><input type="checkbox" id="toggle-hands" /> Eller</label>
    </p>
  </section>

  <div id="modal-result" class="modal" hidden>
    <div class="box">
      <h2 id="result-heading">Bitti</h2>
      <p id="stars-big">☆☆☆☆☆</p>
      <p id="result-stats"></p>
      <button type="button" id="btn-retry">Tekrarla</button>
      <button type="button" id="btn-continue">Devam</button>
    </div>
  </div>

  <div id="modal-badges" class="modal" hidden>
    <div class="box">
      <button type="button" id="badges-close">Kapat</button>
      <h2>Rozetler</h2>
      <div id="badge-grid"></div>
    </div>
  </div>

  <script src="js/sfx.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/keyboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
